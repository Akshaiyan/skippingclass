[build]
  command = "npm run build:static"
  publish = "dist/client"

# When the backend is hosted, put it first so /api/* reaches it (uncomment and set the URL):
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.example.com/api/:splat"
#   status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
